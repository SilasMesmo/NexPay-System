apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nexpay-payments-dev
  namespace: argocd
  labels:
    app.kubernetes.io/name: payments
    app.kubernetes.io/part-of: nexpay
    environment: dev
spec:
  project: default

  source:
    repoURL: https://github.com/SilasMesmo/NexPay-System.git
    targetRevision: main
    path: k8s/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: nexpay-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true