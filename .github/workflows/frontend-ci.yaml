name: Frontend CI

on:
  pull_request:
    paths:
      - "application/frontend/**"
      - ".github/workflows/frontend-ci.yaml"

  push:
    branches:
      - main
    paths:
      - "application/frontend/**"
      - ".github/workflows/frontend-ci.yaml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Smoke Test Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: application/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: application/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Build Docker image
        run: |
          docker build \
            --tag nexpay-frontend:${{ github.sha }} \
            .

      - name: Start container
        working-directory: .
        run: |
          docker run \
            --detach \
            --name nexpay-frontend-ci \
            --publish 8080:80 \
            nexpay-frontend:${{ github.sha }}

      - name: Smoke test
        working-directory: .
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              echo "Frontend health check passed."
              exit 0
            fi

            sleep 1
          done

          echo "Frontend health check failed."
          docker logs nexpay-frontend-ci
          exit 1

      - name: Stop container
        if: always()
        working-directory: .
        run: |
          docker rm --force nexpay-frontend-ci || true