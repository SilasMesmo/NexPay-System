name: Payments CI

on:
  pull_request:
    paths:
      - "application/payments/**"
      - ".github/workflows/payments-ci.yaml"
  push:
    branches:
      - main
    paths:
      - "application/payments/**"
      - ".github/workflows/payments-ci.yaml"

permissions:
  contents: read

concurrency:
  group: payments-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Payments Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/payments
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: application/payments/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff 
        run: ruff check .

      - name: Run tests
        run: python -m pytest

  build:
    name: Build and Smoke Test Payments Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            --tag nexpay-payments:${{ github.sha }} \
            application/payments

      - name: Scan image with Trivy 
        uses: aquasecurity/trivy-action@v0.36.0  
        with: 
          image-ref: "nexpay-payments:${{ github.sha }}" 
          format: "table"
          version: "v0.74.0" 
          severity: "HIGH,CRITICAL" 
          ignore-unfixed: true
          skip-files: "**/pip/_vendor/bom.cdx.json"
          exit-code: "1"

      - name: Start container
        run: |
          docker run \
            --detach \
            --name nexpay-payments-ci \
            --publish 8000:8000 \
            nexpay-payments:${{ github.sha }}

      - name: Smoke test
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              echo "Health check passed."
              exit 0
            fi

            sleep 1
          done

          echo "Health check failed."
          docker logs nexpay-payments-ci
          exit 1

      - name: Stop container
        if: always()
        run: |
          docker rm --force nexpay-payments-ci || true