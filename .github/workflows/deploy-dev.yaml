name: Deploy Dev

on:
  workflow_run:
    workflows:
      - Build Images
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Payments image tag to deploy"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  PAYMENTS_REPOSITORY: nexpay/dev/payments

jobs:
  update-manifest:
    name: Update Dev Manifest
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Determine image tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> "$GITHUB_ENV"
          fi

      - name: Validate configuration
        shell: bash
        run: |
          if [ -z "${{ vars.ECR_REGISTRY }}" ]; then
            echo "ECR_REGISTRY repository variable is not configured."
            exit 1
          fi

          if [ -z "${IMAGE_TAG}" ]; then
            echo "IMAGE_TAG is empty."
            exit 1
          fi

          echo "ECR registry: ${{ vars.ECR_REGISTRY }}"
          echo "Payments repository: ${PAYMENTS_REPOSITORY}"
          echo "Image tag: ${IMAGE_TAG}"

      - name: Update Payments image
        working-directory: k8s/overlays/dev
        shell: bash
        run: |
          sed -i \
            -E "s#(^[[:space:]]*newName:).*#\1 ${{ vars.ECR_REGISTRY }}/${PAYMENTS_REPOSITORY}#" \
            kustomization.yaml

          sed -i \
            -E "s#(^[[:space:]]*newTag:).*#\1 ${IMAGE_TAG}#" \
            kustomization.yaml

      - name: Render Kustomize manifests
        run: |
          kubectl kustomize k8s/overlays/dev

      - name: Check for changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- k8s/overlays/dev/kustomization.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No manifest changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Manifest changes detected:"
            git diff -- k8s/overlays/dev/kustomization.yaml
          fi

      - name: Commit and push manifest update
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/overlays/dev/kustomization.yaml

          git commit \
            -m "deploy(dev): update payments image to ${IMAGE_TAG}"

          git push