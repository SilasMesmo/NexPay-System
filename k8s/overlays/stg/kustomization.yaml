apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nexpay-stg

resources:
- ../../base

namePrefix: stg-

images:
- name: nexpay-payments
  newName: nexpay-payments
  newTag: latest


replicas:
- count: 2
  name: stg-payments
labels:
- includeSelectors: true
  pairs:
    environment: stg